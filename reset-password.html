<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Reset — Darzi Khata</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app-loading"><div class="spool"></div><div style="font-size:13px;color:var(--ink-soft)">Loading…</div></div>

<div class="center-screen hidden" id="reset-screen">
  <div class="card">
    <div class="logo-mark" id="logo-holder"></div>
    <div class="eyebrow" style="text-align:center">Darzi Khata</div>
    <h1 class="title" style="text-align:center">Naya Password Set Karein</h1>
    <p class="subtitle" style="text-align:center">Neeche apna naya password likhein</p>

    <div id="reset-msg" class="msg hidden"></div>

    <form id="reset-form">
      <div class="field">
        <label>Naya Password</label>
        <input type="password" id="new-password" required minlength="6" placeholder="••••••••" />
      </div>
      <div class="field">
        <label>Naya Password Dobara Likhein</label>
        <input type="password" id="confirm-password" required minlength="6" placeholder="••••••••" />
      </div>
      <button type="submit" class="btn-primary">Password Set Karein</button>
    </form>
  </div>
</div>

<div class="center-screen hidden" id="invalid-link-screen">
  <div class="card">
    <h1 class="title">Link Invalid Hai</h1>
    <p class="subtitle">Ye reset link expire ho chuka hai ya galat hai. Login page se dobara "Password bhool gaye" try karein.</p>
    <a href="index.html" class="btn-primary" style="display:block; text-align:center; text-decoration:none;">Wapis Login Pe Jayein</a>
  </div>
</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';
import { SUPABASE_URL, SUPABASE_ANON_KEY, logoSVG } from './config.js';

document.getElementById('logo-holder').innerHTML = logoSVG(44, true);
const $ = id => document.getElementById(id);
const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Supabase automatically picks up the recovery token from the URL hash
supabase.auth.onAuthStateChange((event, session) => {
  $('app-loading').classList.add('hidden');
  if (event === 'PASSWORD_RECOVERY' || (session && window.location.hash.includes('type=recovery'))){
    $('reset-screen').classList.remove('hidden');
  } else if (!session){
    $('invalid-link-screen').classList.remove('hidden');
  }
});

// Fallback: if no event fires quickly, check hash directly
setTimeout(() => {
  if ($('app-loading').classList.contains('hidden')) return;
  $('app-loading').classList.add('hidden');
  if (window.location.hash.includes('type=recovery')){
    $('reset-screen').classList.remove('hidden');
  } else {
    $('invalid-link-screen').classList.remove('hidden');
  }
}, 2500);

$('reset-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = $('new-password').value;
  const p2 = $('confirm-password').value;
  const msg = $('reset-msg');
  msg.classList.add('hidden');

  if (p1 !== p2){
    msg.textContent = 'Dono password match nahi kar rahe.';
    msg.classList.remove('hidden'); msg.classList.remove('success');
    return;
  }

  const { error } = await supabase.auth.updateUser({ password: p1 });
  if (error){
    msg.textContent = error.message;
    msg.classList.remove('hidden'); msg.classList.remove('success');
    return;
  }
  msg.textContent = 'Password change ho gaya! 2 second mein login page pe le jaya jayega…';
  msg.classList.remove('hidden'); msg.classList.add('success');
  setTimeout(() => { window.location.href = 'index.html'; }, 2000);
});
</script>
</body>
</html>
